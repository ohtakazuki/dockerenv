services:
  python:
    build:
      # ビルドコンテキストを ../python に更新
      context: ../python
      dockerfile: Dockerfile
    
    # 作業ディレクトリを /app に更新
    working_dir: /app
    
    # コンテナを開発用に起動し続ける
    command: sleep infinity

    volumes:
      # ホストの python ディレクトリ全体をコンテナの /app にマウント
      - ../python:/app

    ports:
      # TensorBoard 用のポートをホストに公開
      - "6006:6006"
      
    # (任意) コンテナ名を指定
    # container_name: 'tensorflow-gpu-dev'

    # GPU リソースをコンテナに割り当てるための設定 (Docker Compose V2.3+ / specification)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # 利用可能な全ての GPU を割り当てる (特定の GPU を指定も可能)
              capabilities: [gpu] # compute, utility なども指定可能だが gpu が一般的

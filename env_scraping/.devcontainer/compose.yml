services:
  python:
    build:
      # ビルドコンテキストを ../python に更新
      context: ../python
      dockerfile: Dockerfile
    
    # 作業ディレクトリを /app に更新
    working_dir: /app
    
    # コンテナを開発用に起動し続ける
    command: sleep infinity

    volumes:
      # ホストの python ディレクトリ全体をコンテナの /app にマウント
      - ../python:/app
      
    # (任意) コンテナ名を指定
    # container_name: 'scraping-python-dev'
